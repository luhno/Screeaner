<?xml version="1.0" encoding="UTF-8"?>
<!-- Screeaner app icon (1024x1024, macOS grid: 824px body inset by 100px).
     Artwork is drawn in a 108-unit grid shared with the Android adaptive icon
     (android/app/src/main/res/drawable/ic_launcher_foreground.xml). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D212B"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#4F8CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tablet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A9EFF"/>
      <stop offset="1" stop-color="#3F7BF0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <!-- artwork: 108-unit grid, content centred on (52,50) -->
  <g transform="translate(512 512) scale(9.4) translate(-52 -50)">
    <!-- Mac display, partly behind the tablet -->
    <path fill="#E8EEFF" d="M21.5,32 H55.5 V62 H21.5 A3.5,3.5 0 0 1 18,58.5 V35.5 A3.5,3.5 0 0 1 21.5,32 Z"/>
    <path fill="#1A2030" d="M22,34.5 H53 V59.5 H22 A1.5,1.5 0 0 1 20.5,58 V36 A1.5,1.5 0 0 1 22,34.5 Z"/>
    <!-- stand -->
    <path fill="#E8EEFF" fill-opacity="0.55" d="M39,62 H45 V67.5 H39 Z"/>
    <path fill="#E8EEFF" d="M33.25,67.5 H50.75 A1.25,1.25 0 0 1 50.75,70 H33.25 A1.25,1.25 0 0 1 33.25,67.5 Z"/>
    <!-- tablet -->
    <path fill="url(#tablet)" d="M62,30 H82 A4,4 0 0 1 86,34 V66 A4,4 0 0 1 82,70 H62 A4,4 0 0 1 58,66 V34 A4,4 0 0 1 62,30 Z"/>
    <path fill="#1A2030" d="M62,32.5 H82 A1.5,1.5 0 0 1 83.5,34 V66 A1.5,1.5 0 0 1 82,67.5 H62 A1.5,1.5 0 0 1 60.5,66 V34 A1.5,1.5 0 0 1 62,32.5 Z"/>
    <!-- one window spanning both screens -->
    <path fill="#E8EEFF" d="M34.5,42 H53 V53 H34.5 A1.5,1.5 0 0 1 33,51.5 V43.5 A1.5,1.5 0 0 1 34.5,42 Z"/>
    <path fill="#4F8CFF" d="M34.5,42 H53 V44.5 H33 V43.5 A1.5,1.5 0 0 1 34.5,42 Z"/>
    <path fill="#E8EEFF" d="M60.5,42 H71.5 A1.5,1.5 0 0 1 73,43.5 V51.5 A1.5,1.5 0 0 1 71.5,53 H60.5 Z"/>
    <path fill="#4F8CFF" d="M60.5,42 H71.5 A1.5,1.5 0 0 1 73,43.5 V44.5 H60.5 Z"/>
  </g>
</svg>
