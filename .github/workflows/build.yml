name: Build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Screeaner-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: mac
        run: swift test
      - name: Build app bundle
        working-directory: mac
        run: ./scripts/bundle.sh
      - name: Zip
        working-directory: mac/build
        run: ditto -c -k --keepParent Screeaner.app Screeaner-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Screeaner-mac-app
          path: mac/build/Screeaner-mac.zip
