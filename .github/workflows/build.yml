name: Build

# Every push builds both apps, ready to install, as artifacts of the run:
#   Screeaner-android  -> Screeaner.apk, signed with the release key when the
#                         ANDROID_KEYSTORE_* secrets exist (installs over the
#                         previous version), else with a throwaway debug key;
#   Screeaner-mac      -> Screeaner-mac.zip, with that APK inside (so the Mac
#                         updates tablets), signed with MAC_CERT_* if present.
# Publishing a GitHub Release is release.yml's job (tags).

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (when configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/screeaner.jks"
            echo "SCREEANER_KEYSTORE=$RUNNER_TEMP/screeaner.jks" >> "$GITHUB_ENV"
            echo "Release key: the APK installs over earlier releases"
          else
            echo "No ANDROID_KEYSTORE_BASE64 (e.g. a fork's pull request): debug-signed APK"
          fi
      - name: Test and build APK
        working-directory: android
        env:
          SCREEANER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SCREEANER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'screeaner' }}
          SCREEANER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Collect
        run: cp android/app/build/outputs/apk/release/app-release.apk Screeaner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Screeaner-android
          path: Screeaner.apk

  mac:
    needs: android
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Screeaner-android
      - name: Signing certificate (when configured)
        env:
          P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "No MAC_CERT_P12_BASE64: ad-hoc signature"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -p codesigning "$keychain" | grep -oE '[0-9A-F]{40}' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::No code-signing identity in MAC_CERT_P12_BASE64"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Test
        working-directory: mac
        run: swift test
      - name: Build app bundle with the tablet app inside
        working-directory: mac
        env:
          SCREEANER_APK: ${{ github.workspace }}/Screeaner.apk
        run: ./scripts/bundle.sh
      - name: Zip
        working-directory: mac/build
        run: ditto -c -k --keepParent Screeaner.app Screeaner-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Screeaner-mac
          path: mac/build/Screeaner-mac.zip
