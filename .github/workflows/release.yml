name: Release

# Push a tag like v0.6.0 to publish a GitHub Release with:
#   - Screeaner.apk: the tablet app, always signed with the same key, so it
#     installs over the previous version (and the Mac can push it to tablets);
#   - Screeaner-mac.zip: the Mac app, with that APK inside.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
#     required: the tablet app's signing key (see README, "Atualizações").
#     The key alias is "screeaner" and its password is the keystore's, unless
#     ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD say otherwise.
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD
#     optional: a self-signed code-signing certificate, so macOS keeps the
#     Screen Recording / Accessibility grants across updates.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          name="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)"
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but versionName is $name"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see README, Atualizações)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/screeaner.jks"
      - name: Test and build signed APK
        working-directory: android
        env:
          SCREEANER_KEYSTORE: ${{ runner.temp }}/screeaner.jks
          SCREEANER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SCREEANER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'screeaner' }}
          SCREEANER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon
      - name: Collect
        run: cp android/app/build/outputs/apk/release/app-release.apk Screeaner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Screeaner.apk

  mac:
    needs: android
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Signing certificate (optional)
        env:
          P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "No MAC_CERT_P12_BASE64: ad-hoc signature (permissions are asked again after updates)"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # By hash: a self-signed certificate is not "trusted", but it signs
          # fine, and the same certificate keeps the same code identity.
          identity="$(security find-identity -p codesigning "$keychain" | grep -oE '[0-9A-F]{40}' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::No code-signing identity in MAC_CERT_P12_BASE64"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Test
        working-directory: mac
        run: swift test
      - name: Build app bundle with the tablet app inside
        working-directory: mac
        env:
          SCREEANER_APK: ${{ github.workspace }}/Screeaner.apk
        run: ./scripts/bundle.sh
      - name: Zip
        working-directory: mac/build
        run: ditto -c -k --keepParent Screeaner.app "$GITHUB_WORKSPACE/Screeaner-mac.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Screeaner.apk
            Screeaner-mac.zip
          generate_release_notes: true
